services:
    _defaults:
        autowire: true
        autoconfigure: true

    # ADMIN
    itech_world.sulu_grapesjs.builder_admin:
        class: ItechWorld\SuluGrapesJsBundle\Admin\BuilderAdmin
        arguments:
            - '@sulu_admin.view_builder_factory'
            - '%itech_world_sulu_grapesjs.enable_standalone_builder%'
        tags:
            - { name: 'sulu.admin' }
            - { name: 'sulu.context', context: 'admin' }

    ItechWorld\SuluGrapesJsBundle\Controller\Admin\PageBuilderController:
        autowire: true
        autoconfigure: true
        public: true

    # WEBSITE - Controller for builder page rendering (preview + frontend)
    ItechWorld\SuluGrapesJsBundle\Controller\Website\BuilderContentController:
        autowire: true
        autoconfigure: true
        public: true
        tags:
            - { name: 'container.service_subscriber' }

    Symfony\Component\Translation\TranslatorBagInterface: '@translator'
